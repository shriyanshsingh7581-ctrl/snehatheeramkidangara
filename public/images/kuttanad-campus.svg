<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="kuttanadSky" x1="0" y1="0" x2="0" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF3F2"/>
      <stop offset="100%" stop-color="#FAF8F2"/>
    </linearGradient>
    <linearGradient id="riverWater" x1="0" y1="480" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#159A91" stop-opacity="0.35"/>
