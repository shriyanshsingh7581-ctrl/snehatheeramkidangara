    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#kuttanadSky)"/>

  <!-- Soft Morning Sun Over Kuttanad -->
  <circle cx="240" cy="160" r="85" fill="#D8AD62" fill-opacity="0.28"/>

